spring.application.name=backend-auth-tls

server.port=${SERVER_PORT:8443}
server.ssl.enabled=true
server.ssl.key-store=${TLS_KEYSTORE:file:./certs/localhost.p12}
server.ssl.key-store-type=PKCS12
server.ssl.key-store-password=${TLS_KEYSTORE_PASSWORD:}
server.ssl.enabled-protocols=TLSv1.2,TLSv1.3
server.error.include-message=never
server.error.include-stacktrace=never

app.security.jwt.issuer=${JWT_ISSUER:backend-auth-tls}
app.security.jwt.secret-base64=${JWT_SECRET_BASE64:}
app.security.jwt.expiration-seconds=${JWT_EXPIRATION_SECONDS:900}
app.demo.user.password=${DEMO_USER_PASSWORD:}
app.demo.admin.password=${DEMO_ADMIN_PASSWORD:}
app.cors.allowed-origin=${CORS_ALLOWED_ORIGIN:http://localhost:4200}

management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never
